<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Crow &amp; Smith — Design Preview</title><style>*{box-sizing:border-box}body{margin:0;background:#e3e3db;color:#182823;font:12px Arial,sans-serif}header{min-height:64px;display:flex;justify-content:space-between;gap:20px;align-items:center;padding:12px 24px;background:#f8f7f2;border-bottom:1px solid #d1d5c7}strong{font:21px Georgia,serif}nav{display:flex;gap:6px}button,a{border:1px solid #c7cebf;padding:10px 16px;background:transparent;color:inherit;cursor:pointer;text-decoration:none;font-size:11px}button[aria-pressed=true]{background:#182823;color:#fff}main{padding:28px 20px;display:flex;justify-content:center}iframe{width:100%;max-width:1440px;height:calc(100dvh - 120px);border:1px solid #c2c7b9;background:#f8f7f2;box-shadow:0 12px 55px #1828231c}iframe.phone{width:390px;border:7px solid #182823;border-radius:27px;height:844px;max-height:calc(100dvh - 120px)}iframe.tablet{width:820px}@media(max-width:650px){header{flex-wrap:wrap;padding:15px;gap:12px}strong{font-size:18px}button,a{padding:8px 10px}main{padding:15px 8px}iframe{height:calc(100dvh - 140px)}}</style></head><body><header><strong>Crow &amp; Smith <span style="opacity:.5;font:11px Arial">/ Design preview</span></strong><nav aria-label="Device preview"><button data-device="desktop" aria-pressed="true">Desktop</button><button data-device="tablet" aria-pressed="false">Tablet</button><button data-device="phone" aria-pressed="false">Phone</button></nav><a href="/" target="_blank" rel="noopener">Open website ↗</a></header><main><iframe src="/" title="Crow and Smith responsive website preview"></iframe></main><script>const frame=document.querySelector('iframe');document.querySelectorAll('[data-device]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-device]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));frame.className=button.dataset.device==='desktop'?'':button.dataset.device;}));</script></body></html>
